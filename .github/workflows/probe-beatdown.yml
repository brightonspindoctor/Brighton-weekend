name: Probe Beat Down in browser (temporary)
on:
  push:
    branches: [beatdown-probe]
    paths: ['.github/workflows/probe-beatdown.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: |
          python -m pip install -q -r requirements-events.txt && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p probe
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True); pg=await b.new_page()
                  r=await pg.goto('https://www.tickettailor.com/events/beatdown',wait_until='domcontentloaded',timeout=30000)
                  try: await pg.wait_for_load_state('networkidle',timeout=10000)
                  except Exception: pass
                  await pg.wait_for_timeout(2000)
                  open('probe/browser.html','w').write(await pg.content())
                  open('probe/info.txt','w').write(f"status {r.status if r else None}\nurl {pg.url}\ntitle {await pg.title()}\n")
                  await b.close()
          asyncio.run(main())
          PY
          python scripts/tag-genres.py --self-test >/dev/null
          python - <<'PY' >> probe/info.txt
          import sys,types,importlib.util
          sys.path.insert(0,'scripts')
          spec=importlib.util.spec_from_file_location('d','scripts/scrape-discovery.py');d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          ev=d.extract_cards(open('probe/browser.html').read(),'https://www.tickettailor.com/events/beatdown')
          print('parsed',len(ev),ev)
          PY
          git config user.name probe; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe && git commit -m 'probe' && git push origin HEAD:beatdown-probe
