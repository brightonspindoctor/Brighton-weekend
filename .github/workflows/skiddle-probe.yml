name: Skiddle API check

# A one-off look at what the Skiddle API lists in Brighton & Hove, before any of
# it goes into the app. It runs when this file or the script changes on this
# branch (re-run it from the Actions tab once the SKIDDLE_API_KEY secret is
# added), and saves skiddle-report.json on the branch. It never touches main
# and is removed before the pull request is merged.

on:
  workflow_dispatch:
  push:
    branches: ['claude/not-music-event-types']
    paths:
      - 'scripts/skiddle-probe.py'
      - '.github/workflows/skiddle-probe.yml'

permissions:
  contents: write

concurrency:
  group: skiddle-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this branch
        uses: actions/checkout@v5

      - name: Ask the Skiddle API
        env:
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
        run: python3 scripts/skiddle-probe.py

      - name: Save the report on this branch
        run: |
          if [ ! -f skiddle-report.json ]; then echo 'No report (no key yet).'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skiddle-report.json
          if git diff --cached --quiet; then echo 'Report unchanged.'; exit 0; fi
          git commit -m 'Skiddle API check results'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
