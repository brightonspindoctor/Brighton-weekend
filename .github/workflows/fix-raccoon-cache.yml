name: Fix raccoon service worker version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix raccoon service worker version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "navigator.serviceWorker.register('./sw.js?v=72',{updateViaCache:'none'})"
          new = "navigator.serviceWorker.register('./sw.js?v=73',{updateViaCache:'none'})"
          if old not in s:
              raise SystemExit('Expected service worker registration not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix raccoon service worker version'
          git push
