name: Fetch app font
# Downloads the Plus Jakarta Sans font into fonts/ so the app serves it itself
# (no requests from visitors to Google Fonts). Runs when this file or the
# script changes, or on demand from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-font.yml'
      - 'scripts/fetch-font.py'

permissions:
  contents: write

concurrency:
  group: fetch-font
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download font
        run: python scripts/fetch-font.py

      - name: Commit font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/plus-jakarta-sans-latin.woff2
          if git diff --cached --quiet; then
            echo "Font already up to date."
            exit 0
          fi
          git commit -m "Add self-hosted Plus Jakarta Sans font"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
