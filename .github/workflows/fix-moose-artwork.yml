name: Fix moose artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix moose artwork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point app at original moose artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("'moose':'moose.svg'", "'moose':'moose.jpg'")
          p.write_text(s)
          p=Path('sw.js'); s=p.read_text()
          s=s.replace('brighton-weekend-v74-avatar-assets','brighton-weekend-v75-avatar-assets')
          s=s.replace('./profile-icons/moose.svg','./profile-icons/moose.jpg')
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=74'", "navigator.serviceWorker.register('./sw.js?v=75'")
          p.write_text(s)
          PY
      - name: Validate
        run: node scripts/validate-avatars.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix moose artwork'
          git push
