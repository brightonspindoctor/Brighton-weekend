name: Merge verified raccoon asset
on:
  push:
    branches: [main]
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge raccoon asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin raccoon-fix
          git merge --no-edit --no-ff origin/raccoon-fix -m 'Merge verified raccoon avatar asset'
          git push origin main
      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/merge-raccoon-fix.yml .github/workflows/fix-raccoon-asset.yml
          git add -u .github/workflows
          git commit -m 'Remove temporary raccoon workflows' || exit 0
          git push origin main
