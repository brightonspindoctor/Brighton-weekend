name: Probe Skiddle (temporary)
on:
  push:
    branches: [skiddle-probe]
    paths: ['.github/workflows/probe-skiddle.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: |
          python -m pip install -q -r requirements-events.txt
          mkdir -p probe
          python - <<'PY' > probe/info.txt 2>&1
          import json,sys,types,importlib.util
          sys.path.insert(0,'scripts')
          spec=importlib.util.spec_from_file_location('s','scripts/scrape-events.py');s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          for n,u in [('volks','https://www.skiddle.com/whats-on/Brighton/The-Volks-Nightclub/'),('dust','https://www.skiddle.com/whats-on/Brighton/Dust/')]:
              h,f=s.fetch_plain(u); open(f'probe/{n}.html','w').write(h); print(n,'final url',f,'size',len(h))
          for src in []:
              if src.get('jsonld_only') and not src.get('disabled'):
                  try:
                      html,final=s.fetch_plain(src['url'])
                      ev=s.jsonld_events(html,src['venue'],final,src.get('match_location'))
                      print(src['venue'],src['url'],'plain:',len(ev),[e['title'] for e in ev[:3]],'| just-a-moment' if 'Just a moment' in html else '')
                  except Exception as exc:print(src['venue'],src['url'],'ERROR',exc)
          PY
          git config user.name probe; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe && git commit -m probe && git push origin HEAD:skiddle-probe
