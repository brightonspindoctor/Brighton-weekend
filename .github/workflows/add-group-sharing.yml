name: Add group sharing

on:
  push:
    paths:
      - '.github/workflows/add-group-sharing.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch group sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""async function leaveGroup(groupId,groupName,btn){
 if(!groupId)return;
 if(!confirm(`Leave ${groupName}? You can join it again later.`))return;
 btn.disabled=true;
 try{
  const result=await rpc('bw_leave_group',{p_user_id:uid(),p_group_id:groupId});
  const r=Array.isArray(result)?result[0]:result;
  if(!r?.ok)throw new Error(r?.message||'Could not leave group');
  await loadGroups();
  await loadGroupHappenings();
  renderGroupManager();
  renderOnboardingGroups();
  renderPeople();
 }catch(e){btn.disabled=false;alert('Could not leave the group. '+(e.message||e))}
}
"""
          share="""async function shareGroup(groupId,groupName,isPrivate,pin,btn){
 if(!groupId)return;
 const url=window.location.href.split('#')[0];
 const text=isPrivate
  ? `Join my private Brighton Weekend group, ${groupName}. Open Brighton Weekend and join using the group name and PIN ${pin}.`
  : `Join my Brighton Weekend group, ${groupName}. Open Brighton Weekend and choose Join a group to find it.`;
 const shareData={title:`Join ${groupName}`,text,url};
 try{
  if(navigator.share){await navigator.share(shareData);return;}
  await navigator.clipboard.writeText(`${text} ${url}`);
  alert('Group invite copied to your clipboard.');
 }catch(e){
  if(e?.name==='AbortError')return;
  alert('Could not share the group. '+(e.message||e));
 }
}
"""
          if share not in s:
              if old not in s: raise SystemExit('leaveGroup function not found')
              s=s.replace(old,old+share,1)
          oldrow='''<button type="button" class="secondary small-btn" data-leave-group="${esc(g.id)}" data-leave-name="${esc(g.name)}">Leave</button>'''
          newrow='''<div style="display:flex;gap:6px;flex-shrink:0"><button type="button" class="secondary small-btn" data-share-group="${esc(g.id)}" data-share-name="${esc(g.name)}" data-share-private="${g.is_private?'1':'0'}" data-share-pin="${esc(g.join_pin||'')}">Share</button><button type="button" class="secondary small-btn" data-leave-group="${esc(g.id)}" data-leave-name="${esc(g.name)}">Leave</button></div>'''
          if oldrow not in s: raise SystemExit('group action row not found')
          s=s.replace(oldrow,newrow,1)
          marker="document.addEventListener('click',e=>{const b=e.target.closest('[data-leave-group]');if(!b)return;leaveGroup(b.dataset.leaveGroup,b.dataset.leaveName,b)});"
          handler="document.addEventListener('click',e=>{const b=e.target.closest('[data-share-group]');if(!b)return;shareGroup(b.dataset.shareGroup,b.dataset.shareName,b.dataset.sharePrivate==='1',b.dataset.sharePin,b)});"
          if handler not in s:
              if marker not in s: raise SystemExit('leave handler not found')
              s=s.replace(marker,marker+handler,1)
          p.write_text(s)
          PY
      - name: Remove one-time patcher
        run: rm .github/workflows/add-group-sharing.yml
      - name: Commit group sharing
        run: |
          git config user.name 'Brighton Weekend automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-group-sharing.yml
          git commit -m 'Add group sharing'
          git push origin HEAD:main
