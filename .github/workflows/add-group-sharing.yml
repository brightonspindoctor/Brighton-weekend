name: Add group invite links

on:
  push:
    paths:
      - '.github/workflows/add-group-sharing.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add group invite-link button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          invite_fn="""async function createGroupInviteLink(groupId,groupName,isPrivate,pin,btn){
 if(!groupId)return;
 const base=window.location.href.split('#')[0].split('?')[0];
 const params=new URLSearchParams();
 params.set('group_invite',groupId);
 if(groupName)params.set('group_name',groupName);
 if(isPrivate&&pin)params.set('group_pin',pin);
 const url=base+'?'+params.toString();
 const text=`Join my Brighton Weekend group, ${groupName}.`;
 try{
  if(navigator.share){
   await navigator.share({title:`Join ${groupName}`,text,url});
   return;
  }
  await navigator.clipboard.writeText(url);
  alert('Invite link copied to your clipboard.');
 }catch(e){
  if(e?.name==='AbortError')return;
  try{window.prompt('Copy this group invite link:',url)}catch(_){alert(url)}
 }
}
"""

          if 'async function createGroupInviteLink(' not in s:
              m=re.search(r'async function leaveGroup\(groupId,groupName,btn\)\{.*?\n\}\n',s,re.S)
              if not m:
                  raise SystemExit('leaveGroup function not found')
              s=s[:m.end()]+invite_fn+s[m.end():]

          old='''<button type="button" class="secondary small-btn" data-leave-group="${esc(g.id)}" data-leave-name="${esc(g.name)}">Leave</button>'''
          if 'data-invite-group="${esc(g.id)}"' not in s:
              new='''<div style="display:flex;gap:6px;flex-shrink:0"><button type="button" class="secondary small-btn" data-invite-group="${esc(g.id)}" data-invite-name="${esc(g.name)}" data-invite-private="${g.is_private?'1':'0'}" data-invite-pin="${esc(g.join_pin||'')}">Invite link</button><button type="button" class="secondary small-btn" data-leave-group="${esc(g.id)}" data-leave-name="${esc(g.name)}">Leave</button></div>'''
              if old not in s:
                  raise SystemExit('group leave button not found')
              s=s.replace(old,new,1)

          handler="""document.addEventListener('click',e=>{const b=e.target.closest('[data-invite-group]');if(!b)return;createGroupInviteLink(b.dataset.inviteGroup,b.dataset.inviteName,b.dataset.invitePrivate==='1',b.dataset.invitePin,b)});"""
          if '[data-invite-group]' not in s or 'createGroupInviteLink(b.dataset.inviteGroup' not in s:
              marker="document.addEventListener('click',e=>{const b=e.target.closest('[data-leave-group]');if(!b)return;leaveGroup(b.dataset.leaveGroup,b.dataset.leaveName,b)});"
              if marker not in s:
                  raise SystemExit('leave handler not found')
              s=s.replace(marker,marker+handler,1)

          p.write_text(s)
          PY
      - name: Remove patcher
        run: rm .github/workflows/add-group-sharing.yml
      - name: Commit invite-link change
        run: |
          git config user.name 'Brighton Weekend automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-group-sharing.yml
          git commit -m 'Add group invite link button'
          git push origin HEAD:main
