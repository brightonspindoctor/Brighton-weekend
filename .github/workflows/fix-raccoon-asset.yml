name: Fix raccoon avatar asset
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add browser-safe raccoon image
        shell: bash
        run: |
          mkdir -p profile-icons
          echo '' | base64 -d > profile-icons/raccoon.webp
      - name: Use the real asset in the app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("icon==='raccoon'||icon.endsWith('-bear')?'.svg':'.png'", "icon==='raccoon'?'.webp':(icon.endsWith('-bear')?'.svg':'.png')")
          s=s.replace("icon.endsWith('-bear')||icon==='raccoon'?'.svg':'.png'", "icon==='raccoon'?'.webp':(icon.endsWith('-bear')?'.svg':'.png')")
          p.write_text(s)
          p=Path('sw.js'); s=p.read_text().replace('brighton-weekend-v71-bears','brighton-weekend-v72-raccoon-webp')
          s=s.replace('"./profile-icons/raccoon.svg"','"./profile-icons/raccoon.webp"')
          s=s.replace("icon.endsWith('-bear')||icon==='raccoon'?'.svg':'.png'", "icon==='raccoon'?'.webp':(icon.endsWith('-bear')?'.svg':'.png')")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-icons/raccoon.webp index.html sw.js .github/workflows/fix-raccoon-asset.yml
          git commit -m 'Fix raccoon avatar asset' || exit 0
          git push
          rm .github/workflows/fix-raccoon-asset.yml
          git add .github/workflows/fix-raccoon-asset.yml
          git commit -m 'Remove temporary raccoon asset workflow' || true
          git push || true
