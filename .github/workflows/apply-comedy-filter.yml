name: Apply comedy venue filter

on:
  push:
    paths:
      - '.github/workflows/apply-comedy-filter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch venue filters and Discover categories
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text()

          old_venues = 'const VENUES=["Brighton Centre","Brighton Dome","CHALK","Concorde 2","The Old Market","Green Door Store","Volks","Quarters","Patterns","DUST","Komedia","The Forge Comedy Club","Theatre Royal Brighton","The Hope & Ruin","The Prince Albert","A L P H A B E T","The Pipeline","Brighton Racecourse","The Gladstone","Babble","Amex Stadium","Shelter Hall","Other"];'
          new_venues = old_venues + 'const COMEDY_VENUES=["Brighton Centre","Brighton Dome","The Old Market","Komedia","The Forge Comedy Club","Theatre Royal Brighton"];'
          if source.count(old_venues) != 1:
              raise SystemExit('Expected exactly one venue registry to patch')
          source = source.replace(old_venues, new_venues, 1)

          old_html = '<div class="settings-section"><div class="section-head venue-settings-head"><div><h3>Venues</h3><div class="note">Choose which venues appear in Discover.</div></div><div class="venue-actions"><button type="button" class="venue-action secondary" id="selectAllVenues">Select all</button><button type="button" class="venue-action secondary" id="unselectAllVenues">Unselect all</button></div></div><div id="venueList"></div></div>'
          new_html = '<div class="settings-section"><div class="section-head venue-settings-head"><div><h3>Venues</h3><div class="note">Choose which venues appear in Discover.</div></div><div class="venue-actions"><button type="button" class="venue-action secondary" id="selectComedyVenues">Comedy venues</button><button type="button" class="venue-action secondary" id="selectAllVenues">Select all</button><button type="button" class="venue-action secondary" id="unselectAllVenues">Unselect all</button></div></div><div id="venueList"></div></div>'
          if source.count(old_html) != 1:
              raise SystemExit('Expected exactly one venue settings panel to patch')
          source = source.replace(old_html, new_html, 1)

          old_render = """function renderVenues(){
           $('venueList').innerHTML=VENUES.map(v=>`<label class=\"venue-row\">${esc(v)}<input type=\"checkbox\" data-v=\"${esc(v)}\" ${enabled.includes(v)?'checked':''}></label>`).join('');
           document.querySelectorAll('[data-v]').forEach(x=>x.onchange=()=>{enabled=x.checked?[...new Set([...enabled,x.dataset.v])]:enabled.filter(v=>v!==x.dataset.v);localStorage.setItem('bw_venues',JSON.stringify(enabled));renderAll()});
           const all=$('selectAllVenues'),none=$('unselectAllVenues');
           if(all)all.onclick=()=>{enabled=VENUES.slice();localStorage.setItem('bw_venues',JSON.stringify(enabled));renderVenues();renderAll()};
           if(none)none.onclick=()=>{enabled=[];localStorage.setItem('bw_venues',JSON.stringify(enabled));renderVenues();renderAll()};
          }"""
          new_render = """function renderVenues(){
           $('venueList').innerHTML=VENUES.map(v=>`<label class=\"venue-row\">${esc(v)}<input type=\"checkbox\" data-v=\"${esc(v)}\" ${enabled.includes(v)?'checked':''}></label>`).join('');
           document.querySelectorAll('[data-v]').forEach(x=>x.onchange=()=>{enabled=x.checked?[...new Set([...enabled,x.dataset.v])]:enabled.filter(v=>v!==x.dataset.v);localStorage.setItem('bw_venues',JSON.stringify(enabled));renderAll()});
           const comedy=$('selectComedyVenues'),all=$('selectAllVenues'),none=$('unselectAllVenues');
           if(comedy)comedy.onclick=()=>{enabled=[...new Set([...enabled,...COMEDY_VENUES])];localStorage.setItem('bw_venues',JSON.stringify(enabled));renderVenues();renderAll()};
           if(all)all.onclick=()=>{enabled=VENUES.slice();localStorage.setItem('bw_venues',JSON.stringify(enabled));renderVenues();renderAll()};
           if(none)none.onclick=()=>{enabled=[];localStorage.setItem('bw_venues',JSON.stringify(enabled));renderVenues();renderAll()};
          }"""
          if source.count(old_render) != 1:
              raise SystemExit('Expected exactly one renderVenues function to patch')
          source = source.replace(old_render, new_render, 1)

          old_discover = 'const list=events.filter(e=>e.date===dateKey(d)&&venueVisible(e));'
          new_discover = 'const list=events.filter(e=>e.date===dateKey(d)&&venueVisible(e)&&!isComedy(e));'
          if source.count(old_discover) != 1:
              raise SystemExit('Expected exactly one Discover event filter to patch')
          source = source.replace(old_discover, new_discover, 1)

          path.write_text(source)
          PY

      - name: Verify patch
        run: |
          grep -F 'const COMEDY_VENUES=' index.html
          grep -F 'id="selectComedyVenues"' index.html
          grep -F 'venueVisible(e)&&!isComedy(e)' index.html
          git diff --check

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-comedy-filter.yml
          git commit -m 'Add comedy venue filter and separate comedy from Discover'
          git push
