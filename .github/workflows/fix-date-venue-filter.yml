name: Fix date venue filtering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-date-venue-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix venue aliases in date results
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          original = s

          old = "const VENUES=[\"Brighton Centre\",\"Brighton Dome\",\"CHALK\",\"Concorde 2\",\"The Old Market\",\"Green Door Store\",\"Volks\",\"Quarters\",\"Patterns\",\"DUST\",\"Komedia\",\"The Forge Comedy Club\",\"Theatre Royal Brighton\",\"The Hope & Ruin\",\"The Prince Albert\",\"A L P H A B E T\",\"The Pipeline\",\"Brighton Racecourse\",\"The Gladstone\",\"Babble\",\"Amex Stadium\",\"Shelter Hall\",\"Other\"];const COMEDY_VENUES=[\"Brighton Centre\",\"Brighton Dome\",\"The Old Market\",\"Komedia\",\"The Forge Comedy Club\",\"Theatre Royal Brighton\"];"
          new = old + "const VENUE_ALIASES={\"Brighton Dome - Concert Hall\":\"Brighton Dome\"};"
          if old not in s:
              raise SystemExit('VENUES declaration not found')
          if 'const VENUE_ALIASES=' not in s:
              s = s.replace(old, new, 1)

          old_fn = "function venueVisible(e){return e.venue==='Other'||(e.is_custom && e.venue==='Other' ? true : enabled.includes(e.venue))}"
          new_fn = "function canonicalVenue(v){return VENUE_ALIASES[v]||v}"
          new_fn += "\nfunction venueVisible(e){const venue=canonicalVenue(e.venue);return venue==='Other'||(e.is_custom&&venue==='Other'?true:enabled.includes(venue))}"
          if old_fn not in s:
              raise SystemExit('venueVisible function not found')
          s = s.replace(old_fn, new_fn, 1)

          old_merge = "if(e.venue==='Other' && e.venue_detail)e.venue_display='Other · '+e.venue_detail; else e.venue_display=e.venue;"
          new_merge = "if(e.venue==='Other' && e.venue_detail)e.venue_display='Other · '+e.venue_detail; else e.venue_display=canonicalVenue(e.venue);"
          if old_merge not in s:
              raise SystemExit('event venue display code not found')
          s = s.replace(old_merge, new_merge, 1)

          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s)
          PY
      - name: Validate fix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const VENUE_ALIASES=' in s
          assert 'function canonicalVenue(v)' in s
          assert 'canonicalVenue(e.venue)' in s
          print('Date venue filtering fix validated')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'Brighton Weekend automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-date-venue-filter.yml
          git commit -m 'Fix date results for venue name aliases'
          git push origin HEAD:main
