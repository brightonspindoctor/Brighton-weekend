name: Update moose cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Update moose cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text()
          s=s.replace('brighton-weekend-v73-avatar-assets','brighton-weekend-v74-avatar-assets')
          if './profile-icons/moose.svg' not in s:
              s=s.replace('./profile-icons/raccoon.jpg"]','./profile-icons/raccoon.jpg","./profile-icons/moose.svg"]')
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=73'", "navigator.serviceWorker.register('./sw.js?v=74'")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js index.html
          git commit -m 'Update moose cache'
          git push
