name: Remove six dog avatars

on:
  push:
    paths:
      - '.github/workflows/fix-dog-avatars.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dog avatars from the app
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          dogs = ['golden-retriever','black-labrador','cockapoo','french-bulldog','staffy','border-collie']
          p = Path('index.html')
          s = p.read_text()

          icon_list = "," + ",".join("'%s'" % x for x in dogs)
          s = s.replace(icon_list, '')

          labels = "," + ",".join("'%s':'%s'" % (x, {
              'golden-retriever':'Golden Retriever',
              'black-labrador':'Black Labrador',
              'cockapoo':'Cockapoo',
              'french-bulldog':'French Bulldog',
              'staffy':'Staffy',
              'border-collie':'Border Collie',
          }[x]) for x in dogs)
          s = s.replace(labels, '')

          files = "," + ",".join("'%s':'%s.jpg'" % (x, x) for x in dogs)
          s = s.replace(files, '')
          p.write_text(s)

          manifest = Path('profile-icons/avatar-manifest.json')
          data = json.loads(manifest.read_text())
          for dog in dogs:
              data.pop(dog, None)
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git rm profile-icons/golden-retriever.jpg profile-icons/black-labrador.jpg profile-icons/cockapoo.jpg profile-icons/french-bulldog.jpg profile-icons/staffy.jpg profile-icons/border-collie.jpg
          git rm .github/workflows/fix-dog-avatars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html profile-icons/avatar-manifest.json
          git commit -m "Remove six dog avatars"
          git push
