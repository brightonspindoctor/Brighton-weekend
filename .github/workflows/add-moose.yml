name: Add moose avatar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add:
    if: github.event.head_commit.message != 'Add moose avatar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register moose
        run: |
          if grep -q "'moose'" index.html; then
            echo 'Moose already registered.'
            exit 0
          fi
          node scripts/add-avatar.mjs --id=moose --label="Moose" --file=moose.svg
      - name: Validate
        run: node scripts/validate-avatars.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add moose avatar'
          git push
