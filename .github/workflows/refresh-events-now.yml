name: One-off event refresh

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 python-dateutil
          python -m playwright install --with-deps chromium
      - run: python scripts/scrape-events.py
      - name: Commit refreshed events
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          if git diff --cached --quiet; then
            echo 'No event data changes.'
          else
            git commit -m 'Refresh event data now'
            git push
          fi
