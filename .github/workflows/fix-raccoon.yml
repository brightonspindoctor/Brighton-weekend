name: Fix raccoon avatar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-raccoon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add raccoon directly to source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r"'bumblebee'\s*,",'',s)
          s=re.sub(r",\s*'bumblebee'\s*:\s*'Bumblebee'",'',s)
          s=re.sub(r"'bumblebee'\s*:\s*'Bumblebee'\s*,",'',s)
          if "'raccoon'" not in s: s=s.replace("'winged-lion'];","'winged-lion','raccoon'];")
          if "'raccoon':'Raccoon'" not in s: s=s.replace("'winged-lion':'Winged Lion'","'winged-lion':'Winged Lion','raccoon':'Raccoon'")
          s=s.replace("function iconSrc(icon){return 'profile-icons/'+encodeURIComponent(icon)+'.png'}","function iconSrc(icon){return 'profile-icons/'+encodeURIComponent(icon)+(icon==='raccoon'||icon.endsWith('-bear')?'.svg':'.png')}")
          s=s.replace('./sw.js?v=51','./sw.js?v=70')
          p.write_text(s)
          p=Path('sw.js'); s=p.read_text().replace('brighton-weekend-v69-no-bumblebee','brighton-weekend-v70-raccoon').replace('brighton-weekend-v68-avatar-onboarding','brighton-weekend-v70-raccoon'); p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-raccoon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/fix-raccoon.yml
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'Fix raccoon avatar visibility'; git push; fi
