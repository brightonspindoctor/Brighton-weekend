name: Standardise Brighton Weekend avatars
# Avatar framing refresh: keep source artwork clean before standardisation.
# Source extraction refresh.
# Generate new Mystic Creature assets.

on:
  workflow_dispatch:
  push:
    paths:
      - 'profile-icons/**'
      - 'scripts/standardize-avatars.mjs'
      - '.github/workflows/standardize-avatars.yml'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tooling
        run: npm install --no-save sharp

      - name: Standardise avatar artwork
        run: node scripts/standardize-avatars.mjs

      - name: Commit standardised avatars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-icons/standardized profile-icons/avatar-manifest.json index.html
          if git diff --cached --quiet; then
            echo "No avatar changes to commit."
            exit 0
          fi
          git commit -m "Standardise Brighton Weekend avatar artwork"
          git push
