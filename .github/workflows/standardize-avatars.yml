name: Standardise Brighton Weekend avatars
# Rebuilds profile-icons/standardized from the source artwork whenever the
# artwork or the script changes (see scripts/standardize-avatars.mjs).

on:
  workflow_dispatch:
  push:
    paths:
      - 'profile-icons/**'
      - 'scripts/standardize-avatars.mjs'
      - '.github/workflows/standardize-avatars.yml'

permissions:
  contents: write

# Several uploads in a row start several runs. Only the newest is needed,
# because each run rebuilds every avatar, so older runs are cancelled.
concurrency:
  group: standardize-avatars
  cancel-in-progress: true

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tooling
        run: npm install --no-save sharp

      - name: Standardise avatar artwork
        run: node scripts/standardize-avatars.mjs

      - name: Commit standardised avatars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-icons/standardized profile-icons/avatar-manifest.json index.html
          if git diff --cached --quiet; then
            echo "No avatar changes to commit."
            exit 0
          fi
          git commit -m "Standardise Brighton Weekend avatar artwork"
          # Pick up anything pushed while this ran (uploads, the daily event refresh).
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
