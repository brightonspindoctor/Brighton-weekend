name: Daily event refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'event-sources.json'
      - 'scripts/scrape-events.py'
      - 'scripts/scrape-discovery.py'
      - 'scripts/prepare-events.py'
      - 'scripts/event_matching.py'
      - 'scripts/tag-genres.py'
      - 'excluded-events.json'
      - 'scripts/validate-events.py'
      - 'scripts/build-event-pages.py'
      - 'requirements-events.txt'
      - '.github/workflows/weekly-events.yml'
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: daily-event-refresh
  cancel-in-progress: false

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brighton Weekend
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-events.txt
      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-events.txt
          python -m playwright install --with-deps chromium
      - name: Check duplicate-matching rules
        run: python scripts/event_matching.py
      - name: Scrape configured venue websites
        run: python scripts/scrape-events.py
      - name: Scrape broad Brighton discovery calendars
        run: python scripts/scrape-discovery.py
      - name: Prepare event data
        run: python scripts/prepare-events.py
      - name: Tag genres (listing names it, or a confident MusicBrainz match)
        run: |
          python scripts/tag-genres.py --self-test
          python scripts/tag-genres.py
      - name: Validate event data
        run: python scripts/validate-events.py
      - name: Validate critical event coverage
        run: python scripts/validate-required-events.py
      - name: Commit updated events file
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # events.json is regenerated in full on every run, so the fresh file
          # replaces whatever is on main rather than being merged line by line.
          # (Merging failed whenever events.json changed on main during a run.)
          cp events.json "$RUNNER_TEMP/events.json"
          cp genre-cache.json "$RUNNER_TEMP/genre-cache.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/events.json" events.json
          cp "$RUNNER_TEMP/genre-cache.json" genre-cache.json
          # Shareable event pages, the this-weekend page and the sitemap are
          # built from the fresh events.json (see scripts/build-event-pages.py).
          python scripts/build-event-pages.py
          git add events.json genre-cache.json sitemap.xml this-weekend pages.css
          git add -A e
          if git diff --cached --quiet; then
            echo 'No event data changes this run.'
            exit 0
          fi
          git commit -m 'Refresh event data and event pages'
          git push origin HEAD:main
