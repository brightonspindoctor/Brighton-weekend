name: Weekly event refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'event-sources.json'
      - 'scripts/scrape-events.py'
      - 'scripts/scrape-discovery.py'
      - '.github/workflows/weekly-events.yml'
  schedule:
    # GitHub Actions now supports IANA timezones. This runs at 07:00 every
    # Tuesday in Europe/London, automatically following UK daylight saving.
    - cron: '0 7 * * 2'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: weekly-event-refresh
  cancel-in-progress: false

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brighton Weekend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 python-dateutil
          python -m playwright install --with-deps chromium

      - name: Scrape all configured venue websites
        run: python scripts/scrape-events.py

      - name: Scrape broad Brighton discovery calendars
        run: python scripts/scrape-discovery.py

      - name: Commit updated events file
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          if git diff --cached --quiet; then
            echo 'No event data changes this week.'
          else
            git commit -m "Refresh weekly event data"
            git push
          fi
