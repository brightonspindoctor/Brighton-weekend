name: Weekly event refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'event-sources.json'
      - 'scripts/scrape-events.py'
      - 'scripts/scrape-discovery.py'
      - '.github/workflows/weekly-events.yml'
      - '.restore-events-once'
  schedule:
    # GitHub Actions now supports IANA timezones. This runs at 07:00 every
    # Tuesday in Europe/London, automatically following UK daylight saving.
    - cron: '0 7 * * 2'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: weekly-event-refresh
  cancel-in-progress: false

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brighton Weekend
        uses: actions/checkout@v4

      - name: Restore last known-good event data once
        id: restore
        shell: bash
        run: |
          if [[ -f .restore-events-once ]]; then
            echo 'restored=true' >> "$GITHUB_OUTPUT"
            git fetch --unshallow
            git show 02cb2f3b15d96da769f2052fc9a4da781b761901:events.json > events.json
            rm .restore-events-once
            git config user.name 'Brighton Weekend event scraper'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add events.json .restore-events-once
            git commit -m 'Restore event data after destructive refresh'
            git push
          else
            echo 'restored=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.restore.outputs.restored != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        if: steps.restore.outputs.restored != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 python-dateutil
          python -m playwright install --with-deps chromium

      - name: Scrape all configured venue websites
        if: steps.restore.outputs.restored != 'true'
        run: python scripts/scrape-events.py

      - name: Scrape broad Brighton discovery calendars
        if: steps.restore.outputs.restored != 'true'
        run: python scripts/scrape-discovery.py

      - name: Commit updated events file
        if: steps.restore.outputs.restored != 'true'
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          if git diff --cached --quiet; then
            echo 'No event data changes this week.'
          else
            git commit -m "Refresh weekly event data"
            git push
          fi
