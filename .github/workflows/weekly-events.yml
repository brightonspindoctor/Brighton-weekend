name: Weekly event refresh

on:
  workflow_dispatch:
  # GitHub Actions schedules are UTC. Run at both 06:00 and 07:00 UTC and
  # let the job below select the one that is 07:00 Europe/London. This keeps
  # the refresh at 7am through the UK daylight-saving change.
  schedule:
    - cron: '0 6,7 * * 2'

permissions:
  contents: write

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brighton Weekend
        uses: actions/checkout@v4

      - name: Check local UK time
        id: gate
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          DOW=$(TZ=Europe/London date +%u)
          echo "Europe/London: $(TZ=Europe/London date)"
          if [ "$DOW" = "2" ] && [ "$HOUR" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 python-dateutil
          python -m playwright install --with-deps chromium

      - name: Scrape all venue websites
        if: steps.gate.outputs.run == 'true'
        run: python scripts/scrape-events.py

      - name: Commit updated events file
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json
          if git diff --cached --quiet; then
            echo 'No event data changes this week.'
          else
            git commit -m "Refresh weekly event data"
            git push
          fi
