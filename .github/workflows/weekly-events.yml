name: Daily event refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'event-sources.json'
      - 'scripts/scrape-events.py'
      - 'scripts/scrape-discovery.py'
      - 'scripts/prepare-events.py'
      - 'scripts/event_matching.py'
      - 'scripts/listing_rules.py'
      - 'scripts/tag-genres.py'
      - 'scripts/check-tickets.py'
      - 'excluded-events.json'
      - 'scripts/validate-events.py'
      - 'scripts/build-event-pages.py'
      - 'requirements-events.txt'
      - '.github/workflows/weekly-events.yml'
  # GitHub can start scheduled runs hours late, or drop them when it's busy, so
  # there are several start times. The first to run refreshes the listings; the
  # others see that today's refresh is done and stop straight away.
  schedule:
    - cron: '17 1 * * *'
      timezone: 'Europe/London'
    - cron: '17 5 * * *'
      timezone: 'Europe/London'
    - cron: '17 9 * * *'
      timezone: 'Europe/London'
    - cron: '17 13 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: daily-event-refresh
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: Check out events.json
        uses: actions/checkout@v5
        with:
          sparse-checkout: events.json
          sparse-checkout-cone-mode: false
      - name: Has today's refresh already run?
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(TZ=Europe/London date +%F)
          updated=$(python3 -c "import json; print(json.load(open('events.json')).get('updated', ''))")
          if [ "$EVENT" = "schedule" ] && [ "$updated" = "$today" ]; then
            echo "Listings already refreshed today ($today)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-events:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brighton Weekend
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-events.txt
      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-events.txt
          python -m playwright install --with-deps chromium
      - name: Check duplicate-matching rules
        run: python scripts/event_matching.py
      - name: Scrape configured venue websites
        run: python scripts/scrape-events.py
      - name: Scrape broad Brighton discovery calendars
        run: python scripts/scrape-discovery.py
      - name: Prepare event data
        run: python scripts/prepare-events.py
      - name: Follow ticket links to the seller and mark sold-out shows
        run: python scripts/check-tickets.py
        timeout-minutes: 35
        continue-on-error: true  # a problem here must never stop the day's listings
      - name: Tag genres (listing names it, or a confident MusicBrainz or Wikidata match)
        run: |
          python scripts/tag-genres.py --self-test
          python scripts/tag-genres.py
      - name: Validate event data
        run: python scripts/validate-events.py
      - name: Validate critical event coverage
        run: python scripts/validate-required-events.py
      - name: Commit updated events file
        run: |
          git config user.name 'Brighton Weekend event scraper'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # events.json is regenerated in full on every run, so the fresh file
          # replaces whatever is on main rather than being merged line by line.
          # If something else reaches main while this runs (the festival refresh,
          # an avatar), the push is refused: start again from the new main.
          cp events.json "$RUNNER_TEMP/events.json"
          cp genre-cache.json "$RUNNER_TEMP/genre-cache.json"
          if [ -f ticket-cache.json ]; then cp ticket-cache.json "$RUNNER_TEMP/ticket-cache.json"; fi
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/events.json" events.json
            cp "$RUNNER_TEMP/genre-cache.json" genre-cache.json
            if [ -f "$RUNNER_TEMP/ticket-cache.json" ]; then cp "$RUNNER_TEMP/ticket-cache.json" ticket-cache.json; fi
            # Shareable event pages, the this-weekend page and the sitemap are
            # built from the fresh events.json (see scripts/build-event-pages.py).
            python scripts/build-event-pages.py
            git add events.json genre-cache.json sitemap.xml pages.css
            git add -A e this-weekend tonight gigs comedy club-nights theatre venues
            if [ -f ticket-cache.json ]; then git add ticket-cache.json; fi
            if git diff --cached --quiet; then
              echo 'No event data changes this run.'
              exit 0
            fi
            git commit -q -m 'Refresh event data and event pages'
            if git push -q origin HEAD:main; then
              touch "$RUNNER_TEMP/pushed"
              exit 0
            fi
            echo "main moved on while this ran; trying again ($attempt)."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Tell Bing about new pages (IndexNow)
        # Only after a push, so the pages are on their way to the live site.
        # Never fails the run (see scripts/indexnow.py).
        run: |
          if [ -f "$RUNNER_TEMP/pushed" ]; then python scripts/indexnow.py; else echo 'Nothing pushed, nothing to send.'; fi
        continue-on-error: true
