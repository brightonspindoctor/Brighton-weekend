name: Fix Happenings indicator

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch Happenings behaviour
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()

          # The Search 2.0 nav handler replaces the original nav handlers,
          # so explicitly mark Happenings as seen when its tab is opened.
          old="b.classList.add('active');document.querySelectorAll('main').forEach(m=>m.classList.toggle('hidden',m.id!==b.dataset.tab))"
          new="b.classList.add('active');document.querySelectorAll('main').forEach(m=>m.classList.toggle('hidden',m.id!==b.dataset.tab));if(b.dataset.tab==='peopleTab'&&typeof markHappeningsSeen==='function')markHappeningsSeen()"
          if old not in s:
              raise SystemExit('navigation handler not found in sw.js')
          s=s.replace(old,new,1)

          # Remove the indicator dot; the label itself is the only indicator.
          s=s.replace(".nav button.has-new::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#f06b61;top:6px;right:8px;box-shadow:0 0 0 2px #102033}", '')

          # Strip the accidentally rendered repair-script text if it exists in
          # the source page before the transformed page is returned.
          marker='Settings\\ndocument.addEventListener(\\'click\\',e=>{const b=e.target.closest(\\'.nav button[data-tab="peopleTab"]\\')'
          if marker in s:
              start=s.find('Settings\\ndocument.addEventListener')
              end=s.find('</body>', start)
              if end!=-1:
                  s=s[:start]+s[end:]

          s=s.replace('const CACHE="brighton-weekend-v106-assets"','const CACHE="brighton-weekend-v107-assets"',1)
          p.write_text(s)
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'Brighton Weekend automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js .github/workflows/fix-happenings-indicator.yml
          git commit -m 'Fix Happenings indicator behaviour'
          git rm .github/workflows/fix-happenings-indicator.yml
          git commit -m 'Remove one-time Happenings repair workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
