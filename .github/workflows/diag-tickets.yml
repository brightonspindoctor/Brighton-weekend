name: Diag ticket checker dry run (temporary)
on:
  push:
    branches: [diag-tickets]
    paths: ['scripts/check-tickets.py','.github/workflows/diag-tickets.yml']
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-events.txt && python -m playwright install --with-deps chromium
      - name: Dry run
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          cp events.json diag/before.json
          ( /usr/bin/time -v python scripts/check-tickets.py ) 2>&1 | tee diag/run.log
      - name: Save results
        if: always()
        shell: bash
        run: |
          python diag/report.py || true
          git config user.name diag; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f diag/run.log diag/report.json ticket-cache.json 2>/dev/null || git add -f diag/run.log
          git commit -m "diag dry run" && git push
