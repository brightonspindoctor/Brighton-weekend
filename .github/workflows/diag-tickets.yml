name: Diag ticket pages (temporary)
on:
  push:
    branches: [diag-tickets]
    paths: ['diag/sample.json','diag/fetch.py','.github/workflows/diag-tickets.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-events.txt && python -m playwright install --with-deps chromium
      - run: python diag/fetch.py
      - run: |
          tar czf diag/pages.tgz -C diag out
          git config user.name diag; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag/pages.tgz; git commit -m "diag pages"; git push
