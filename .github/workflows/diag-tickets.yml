name: Diag ticket checker dry run (temporary)
on:
  push:
    branches: [diag-tickets]
    paths: ['scripts/check-tickets.py','.github/workflows/diag-tickets.yml']
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-events.txt && python -m playwright install --with-deps chromium
      - timeout-minutes: 35
        run: cp events.json diag/before.json && python scripts/check-tickets.py 2>&1 | tee diag/run.log
      - run: |
          python diag/report.py
          git config user.name diag; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag/report.json diag/run.log ticket-cache.json; git commit -m "diag dry run"; git push
