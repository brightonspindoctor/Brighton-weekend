name: Diag ticket pages (temporary)
on:
  push:
    branches: [diag-tickets]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-events.txt && python -m playwright install --with-deps chromium
      - run: python diag/fetch.py
      - uses: actions/upload-artifact@v4
        with: {name: pages, path: diag/out, retention-days: 2}
