name: Bump avatar cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("sw.js?v=70", "sw.js?v=71")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump service worker registration to v71" || true
          git push || true
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/bump-avatar-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/bump-avatar-cache.yml
          git commit -m "Remove temporary cache bump workflow" || true
          git push || true
