<title>Not found | Brighton Weekend</title>
<script>
// An event page that no longer exists (the event has passed, or its listing
// changed) still opens in the app, which knows merged and older event ids.
(function(){var m=location.pathname.match(/^\/e\/([a-z0-9-]+)\/?$/);if(!m)return;var q=new URLSearchParams(location.search);q.delete('share');q.set('event',m[1]);location.replace('/?'+q.toString());})();
</script>
