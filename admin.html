<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brighton Weekend · Admin</title>
<style>
:root{--bg:#101114;--card:#1a2c3b;--line:#42576a;--cream:#f3e4c9;--sage:#d8e59e;--muted:#aeb9bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 18px}h1{font-size:28px;margin:0 0 4px}h2{font-size:19px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.stat{font-size:56px;font-weight:800;color:var(--sage);letter-spacing:-3px}.small{font-size:12px;color:var(--muted)}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#101114;color:white;margin:6px 0;font:inherit}button{padding:11px 15px;border-radius:999px;border:1px solid #566874;background:#20384a;color:var(--cream);font-weight:700;cursor:pointer}button.primary{background:var(--sage);color:#172335;border-color:var(--sage)}.error{color:#ffb3ba}
</style>
</head>
<body><main>
<h1>Brighton Weekend · Admin</h1><div class="muted">Private usage dashboard</div>
<section id="login" class="card"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="loginBtn">Sign in</button><div id="loginError" class="error"></div></section>
<section id="dashboard" class="hidden">
<div class="card"><div class="muted">Unique app users</div><div class="stat" id="count">—</div><div class="small">Unique browser/app IDs seen by Brighton Weekend</div></div>
<div class="card"><h2>Last 30 days</h2><div class="stat" id="recent">—</div><div class="small">Unique IDs with a visit in the last 30 days</div></div>
<div class="card"><div class="muted">Latest tracked activity</div><div id="last" style="margin-top:8px">—</div></div>
<button id="signout">Sign out</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://zqvccsnfrkrtcsitfwcd.supabase.co',KEY='sb_publishable_IyzJ6iCrIIkCtYBhNkQUog_GelEFKo1';
const db=supabase.createClient(URL,KEY), $=id=>document.getElementById(id);
async function load(){
 const {data:user}=await db.auth.getUser(); if(!user.user){$('login').classList.remove('hidden');return}
 $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');
 const {data,error}=await db.rpc('admin_usage_stats'); if(error){$('loginError').textContent=error.message;return}
 $('count').textContent=data.total_users;
 $('recent').textContent=data.recent_users;
 $('last').textContent=data.last_seen ? new Date(data.last_seen).toLocaleString('en-GB') : 'No activity yet';
}
$('loginBtn').onclick=async()=>{ $('loginError').textContent=''; const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error){$('loginError').textContent=error.message;return}load()};
$('signout').onclick=async()=>{await db.auth.signOut();location.reload()}; load();
</script></body></html>
