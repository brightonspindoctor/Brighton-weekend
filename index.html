<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122338">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Brighton Weekend</title>
<style>
:root{--ink:#172335;--cream:#f3e4c9;--orange:#b94f2d;--gold:#d6a54c;--lime:#c8d989}
*{box-sizing:border-box} body{margin:0;font-family:var(--font-ui);background:#102033;color:var(--cream)}
button,input{font:inherit} .hidden{display:none!important}

/* Welcome screen */
#welcome{position:fixed;inset:0;z-index:20;min-height:100dvh;background:
linear-gradient(rgba(7,17,29,.18),rgba(7,17,29,.3)),url("welcome-background.png") center/cover no-repeat;
display:grid;place-items:center;padding:20px}
.welcome-card{width:min(540px,92vw);background:rgba(247,232,204,.96);color:var(--ink);
border:4px solid #192a38;border-radius:24px;padding:28px 26px;box-shadow:0 15px 0 rgba(0,0,0,.25),0 20px 60px rgba(0,0,0,.45);text-align:center}
.welcome-card h2{font-size:2.5rem;margin:0 0 10px;letter-spacing:-1px}.welcome-card p{font-family:var(--font-ui);font-size:1.05rem;line-height:1.45;margin:0 0 20px}
.welcome-card input{width:100%;padding:16px 18px;border:2px solid #776d61;border-radius:14px;background:#fffaf0;color:#182638;font-family:var(--font-ui);font-size:1.1rem}
.welcome-card button{width:100%;margin-top:14px;padding:16px;border:3px solid #17222c;border-radius:40px;background:linear-gradient(#cc6841,#a84329);color:#fff7e8;font-size:1.5rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #71301f}
.welcome-card button:active{transform:translateY(3px);box-shadow:0 2px 0 #71301f}

/* App */
header{position:sticky;top:0;z-index:5;background:#122238;border-bottom:1px solid rgba(242,225,194,.25);padding:15px}
.wrap{max-width:820px;margin:auto;padding:0 15px}.brand{font-size:1.8rem;font-weight:bold;letter-spacing:-1px;color:var(--cream)}.brand span{color:#d66a40}
.sub{font-family:var(--font-ui);color:#b8c6a0;font-size:.8rem;margin-top:2px}
.controls{display:flex;gap:7px;margin-top:12px}.controls button{background:#20364b;color:var(--cream);border:1px solid #52667a;border-radius:10px;padding:10px;cursor:pointer}.week{flex:1}.today{color:#d8e59e!important}
.day{margin:22px 0 8px;color:#d8e59e;font:bold .78rem system-ui,sans-serif;letter-spacing:1px}
.card{background:#1b3041;border:1px solid #42576a;border-radius:16px;padding:15px;margin:9px 0;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:1.18rem;font-weight:bold}.meta{font: .85rem system-ui,sans-serif;color:#b9c4cb;margin-top:5px}
.badge{font:.65rem system-ui,sans-serif;font-weight:bold;padding:5px 7px;border-radius:20px;height:max-content}.sold{background:#713545;color:#ffd3d8}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.people span{font:.72rem var(--font-ui);background:#263d50;padding:5px 8px;border-radius:20px;color:#d9e0d5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.ticket{border-radius:10px;padding:9px 11px;font:bold .75rem system-ui,sans-serif;cursor:pointer;text-decoration:none}
.interest,.going{background:#213849;border:1px solid #607587;color:#f3e4c9}.interest.active{border-color:#d8e59e;color:#d8e59e}.going.active{background:#d8e59e;color:#172335;border-color:#d8e59e}.ticket{background:#f3e4c9;color:#172335}
.nav{position:fixed;bottom:0;left:0;right:0;background:#14273a;border-top:1px solid #405568;display:flex;justify-content:space-around;padding:12px max(12px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#9cabb2;font:bold .75rem system-ui,sans-serif}.nav button.active{color:#d8e59e}
.venue-row{display:flex;justify-content:space-between;padding:15px 2px;border-bottom:1px solid #405568;font-family:var(--font-ui)}.venue-row input{accent-color:#b9c76d;width:20px}
.empty{font-family:var(--font-ui);color:#91a0a8;padding:10px 0}
</style>

<style id="jakarta-design-system">
:root{
  --font-ui:"Plus Jakarta Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ink:#172335; --cream:#f3e4c9; --navy:#122238; --card:#1b3041;
  --line:#42576a; --sage:#d8e59e; --orange:#b85a38; --muted:#aeb9bf;
}
html,body,button,input,a{font-family:var(--font-ui)!important}
body{letter-spacing:-.01em}
h1,h2,h3,p,.brand,.sub,.title,.meta,.price,.empty,.note,.day,
.statusline,.venue-row,.nav button,.ticket,.actions button,.scale,
.people,.badge,.week,.today{font-family:var(--font-ui)!important}

.brand{font-weight:800;letter-spacing:-.045em}
.brand span{font-weight:800}
h2{font-size:1.45rem;line-height:1.15;letter-spacing:-.035em;margin:24px 0 8px}
.title{font-size:1.05rem;line-height:1.25;font-weight:700;letter-spacing:-.025em}
.meta{font-size:.78rem;line-height:1.4;font-weight:500}
.price{font-size:.78rem;line-height:1.3;font-weight:700}
.day{font-size:.7rem;line-height:1.2;font-weight:800;letter-spacing:.06em}
.sub,.statusline,.note,.empty{font-size:.72rem;line-height:1.45;font-weight:500}
.controls{align-items:stretch}
.controls button{display:flex;align-items:center;justify-content:center;min-height:42px}
.week{font-weight:700;letter-spacing:-.01em}
.today{font-weight:700}
.card{padding:15px 15px 14px;margin:9px 0;border-radius:16px}
.actions{align-items:center}
.actions button,.ticket{font-weight:700;letter-spacing:-.01em}
.people{align-items:center}
.people span{font-weight:500}
.commitment{align-items:stretch}
.scale{font-family:var(--font-ui)!important;font-weight:600;letter-spacing:-.005em}
.venue-row{font-weight:600}
.nav{gap:4px}
.nav button{flex:1;max-width:180px}
.nav{justify-content:center}
.nav button{letter-spacing:-.005em}
.ticket{display:inline-flex;align-items:center;justify-content:center}
.people-card{padding-bottom:15px}
.people-card h3{font-family:var(--font-ui)!important;font-weight:700;letter-spacing:-.025em}
.plusone{font-family:var(--font-ui)!important}
.plusbtn{font-family:var(--font-ui)!important}
.modalbox h2{font-family:var(--font-ui)!important;font-weight:800}
.modalbox p{font-family:var(--font-ui)!important}
.modal input,.modal button{font-family:var(--font-ui)!important}
@media (max-width:430px){
  .controls{gap:5px}
  .controls button{min-height:40px;padding:9px 8px}
  .week{font-size:.77rem}
  .commitment{gap:5px}
  .scale{font-size:9px;min-height:40px;padding:8px 6px}
  .nav button{font-size:11px}
}
</style>

<style id="alignment-system">
.wrap{width:100%;max-width:780px;margin-left:auto;margin-right:auto}
.app-main{padding-top:4px}
header .wrap{padding-left:15px;padding-right:15px}
.controls>*{min-width:0}
.card .actions .ticket{min-height:38px}
.card .actions button{min-height:38px}
.people-card{margin-left:0;margin-right:0}
</style>

<style id="v11-commitment">
.commitment{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:13px;flex-wrap:wrap}
.commit-btn{
  appearance:none;border:0;background:transparent;color:#bfc7c9;
  display:inline-flex;align-items:center;gap:6px;padding:6px 3px;
  font:600 12px/1 var(--font-ui);letter-spacing:-.02em;
  cursor:pointer;border-radius:999px;transition:color .16s ease,transform .12s ease,background .16s ease
}
.commit-btn:hover{background:rgba(255,255,255,.035)}
.commit-btn:active{transform:scale(.97)}
.commit-icon{
  width:28px;height:28px;border:1px solid #566874;border-radius:50%;
  display:inline-grid;place-items:center;font:500 17px/1 var(--font-ui);
  background:#20384a;color:#d9d5ca;flex:0 0 28px
}
.commit-btn.no .commit-icon{color:#d5b1b6;border-color:#75585f}
.commit-btn.yes .commit-icon{color:#d7e3a4;border-color:#687451;font-size:19px}
.commit-btn.bought .commit-icon{color:#e1c09b;border-color:#725f4c;font-size:14px}
.commit-btn.selected.no{color:#f0d6d9}
.commit-btn.selected.no .commit-icon{background:#3b2d31;border-color:#a06a72;color:#f0d6d9;box-shadow:0 0 0 2px rgba(160,106,114,.12)}
.commit-btn.selected.yes{color:#e0eab8}
.commit-btn.selected.yes .commit-icon{background:#304039;border-color:#9cac70;color:#e0eab8;box-shadow:0 0 0 2px rgba(156,172,112,.12)}
.commit-btn.selected.bought{color:#efcca1}
.commit-btn.selected.bought .commit-icon{background:#47382a;border-color:#b88d5e;color:#efcca1;box-shadow:0 0 0 2px rgba(184,141,94,.12)}
.plusone{
  display:flex;align-items:center;gap:7px;margin-top:9px;
  font:600 12px/1.2 var(--font-ui);color:#c8c1b5
}
.plusone span{margin-right:2px}
.plusbtn{
  width:28px;height:28px;border-radius:50%;border:1px solid #566874;
  background:#20384a;color:#e4ddd0;font:600 17px/1 var(--font-ui);cursor:pointer;
  display:inline-grid;place-items:center
}
.plusbtn:hover{background:#294456}
.people-card .commitment{margin-top:12px}
</style>

<style id="icon-design-system">
:root{
  --ui-font:"Plus Jakarta Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg:#101114; --navy:#122238; --card:#1a2c3b; --line:#3d5565;
  --cream:#f3e4c9; --muted:#a8b3b9; --sage:#d8e59e; --mush:#b86a48;
}
html,body{font-family:var(--ui-font)!important}
body{background:var(--bg)}
h1,h2,h3,.brand,.sub,.title,.meta,.price,.day,.empty,.note,
.statusline,.nav button,.week,.today,.ticket,.actions button,.venue-row,
.commitment,.commit-btn,.plusone,.plusbtn,.people,.badge{font-family:var(--ui-font)!important}

/* Shared icon language */
.icon-chip{
  display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;
  border:1px solid #596f7b;background:#1d3546;color:#e2ddd1;
  font:500 16px/1 var(--ui-font);flex:0 0 28px;
}
.icon-chip.heart{color:#d6e2a3;border-color:#687452}
.icon-chip.ticket{color:#e3c49f;border-color:#725e49}
.icon-chip.cross{color:#d5b3b7;border-color:#75585e}

/* App-wide compact "icon + label" pattern */
.ui-pill{
  display:inline-flex;align-items:center;gap:7px;border:1px solid #455d6b;
  border-radius:999px;padding:5px 9px 5px 5px;background:rgba(255,255,255,.018);
  color:#d4d9d5;font:600 11px/1 var(--ui-font);letter-spacing:-.015em;
}
.ui-pill .icon-chip{width:24px;height:24px;flex-basis:24px;font-size:14px;background:#20394b}

/* Event commitment controls */
.commitment{display:flex;align-items:center;gap:7px;margin-top:13px;flex-wrap:wrap}
.commit-btn{
  appearance:none;border:1px solid #455d6b;background:transparent;color:#c8cfd0;
  display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;
  font:600 11px/1 var(--ui-font);letter-spacing:-.015em;cursor:pointer;border-radius:999px;
  transition:background .15s,border-color .15s,color .15s,transform .12s
}
.commit-btn:hover{background:rgba(255,255,255,.035);border-color:#627986}
.commit-btn:active{transform:scale(.985)}
.commit-icon{width:27px;height:27px;border:1px solid #566874;border-radius:50%;display:inline-grid;place-items:center;background:#20384a;flex:0 0 27px;font:500 16px/1 var(--ui-font)}
.commit-btn.no .commit-icon{color:#d5b3b7;border-color:#75585e}
.commit-btn.yes .commit-icon{color:#d7e2a4;border-color:#687452;font-size:18px}
.commit-btn.bought .commit-icon{color:#e3c49f;border-color:#725e49;font-size:13px}
.commit-btn.selected.no{background:#33272b;color:#edcbcf;border-color:#835d64}
.commit-btn.selected.yes{background:#293733;color:#dce7ac;border-color:#8f9e69}
.commit-btn.selected.bought{background:#403228;color:#efd0a7;border-color:#ab8257}

/* Shared social summary chips */
.people{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:11px}
.people span{
  display:inline-flex;align-items:center;gap:5px;background:#213849;border:1px solid #334d5e;
  padding:5px 8px;border-radius:999px;font:500 10px/1 var(--ui-font);color:#cfd5d3
}
.people .social-chip{padding:4px 7px 4px 4px}
.social-icon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;border:1px solid #516777}
.social-icon.heart{color:#d7e2a4;border-color:#687452}
.social-icon.ticket{color:#e3c49f;border-color:#725e49}

/* Happenings cards use exactly the same icon language */
.people-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}
.people-card h3{font:700 17px/1.25 var(--ui-font)!important;letter-spacing:-.03em}
.happening-section{display:flex;align-items:center;gap:7px;font:800 10px/1 var(--ui-font);letter-spacing:.08em;color:#aebcc0;margin:14px 0 7px}
.happening-section .icon-chip{width:24px;height:24px;flex-basis:24px;font-size:13px}

/* Navigation */
.nav button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-icon{font-size:15px;line-height:1}
.nav button.active{color:var(--sage)}
.nav button.active .nav-icon{transform:translateY(-1px)}

/* Venue toggles */
.venue-row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid #303b43;font-weight:600}
.venue-name{display:flex;align-items:center;gap:8px}
.venue-dot{width:8px;height:8px;border-radius:50%;background:#506673;box-shadow:0 0 0 3px rgba(80,102,115,.13)}
.venue-row input{accent-color:var(--sage);width:20px;height:20px}

/* Date / weekend treatment */
.weekend-mark{
  display:inline-flex;align-items:center;gap:6px;margin:8px 0 2px;color:#cbd3d0;
  font:600 11px/1 var(--ui-font)
}
.weekend-mark .tiny-icon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid #556a72;color:#d8e59e}

/* Ticket button */
.ticket{display:inline-flex;align-items:center;gap:6px}
.ticket::before{content:"🎟";font-size:13px}

/* Plus one */
.plusone{display:flex;align-items:center;gap:7px;margin-top:9px;font:600 11px/1.2 var(--ui-font);color:#c8c1b5}
.plusbtn{width:28px;height:28px;border-radius:50%;border:1px solid #566874;background:#20384a;color:#e4ddd0;font:600 17px/1 var(--ui-font);cursor:pointer;display:inline-grid;place-items:center}

/* Consistent card hierarchy */
.card{box-shadow:0 6px 18px rgba(0,0,0,.08)}
</style>
</head>
<body>

</div>

<section id="welcome">
  <div class="welcome-card">
    <h2>Welcome!</h2>
    <p>Enter your name to see what's on in Brighton this weekend.</p>
    <form id="nameForm">
      <input id="nameInput" placeholder="🍄 Your name..." maxlength="40" required autocomplete="name">
      <button type="submit">Party On →</button>
    </form>
  </div>
</section>

<header><div class="wrap">
  <div class="brand">BRIGHTON <span>WEEKEND</span></div>
  <div class="sub" id="subtitle">Friday · Saturday · Sunday</div>
  <div class="controls">
    <button id="prev">‹</button><button id="week" class="week"></button><button id="next">›</button>
    <button id="today" class="today">TODAY</button><button id="refresh">↻</button>
  </div>
</div></header>

<main id="discover" class="wrap app-main"></main>
<main id="peopleTab" class="wrap app-main hidden">
<h2>Happenings</h2>
<p class="note">See what people are interested in and where they have bought tickets.</p>
<div id="peopleList"></div>
</main>
<main id="venuesTab" class="wrap app-main hidden"><h2>Venues</h2><div id="venueList"></div><br><button id="changeName">Change my name</button></main>
<div class="nav"><button class="active" data-tab="discover"><span class="nav-icon">♬</span> Discover</button><button data-tab="peopleTab"><span class="nav-icon">♡</span> Happenings</button><button data-tab="venuesTab"><span class="nav-icon">◌</span> Venues</button></div>

<script>
(() => {
const SUPABASE_URL='https://zqvccsnfrkrtcsitfwcd.supabase.co';
const SUPABASE_KEY='sb_publishable_IyzJ6iCrIIkCtYBhNkQUog_GelEFKo1';
const VENUES=["Brighton Centre","Brighton Dome","CHALK","Concorde 2","The Old Market","Green Door Store","Volks","Quarters","Patterns","DUST"];
const $=id=>document.getElementById(id);
let events=[], attendance=[], enabled=JSON.parse(localStorage.getItem('bw_venues')||'null')||VENUES;
function getFriday(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(5-d.getDay()+7)%7);return d}
let friday=getFriday();
function uid(){let x=localStorage.getItem('bw_uid');if(!x){x=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('bw_uid',x)}return x}
function name(){return localStorage.getItem('bw_name')||''}
function dateKey(d){return d.toISOString().slice(0,10)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function people(id,status){return attendance.filter(x=>x.event_id===id&&x.status===status)}

$('nameForm').addEventListener('submit',e=>{
 e.preventDefault(); const n=$('nameInput').value.trim(); if(!n)return;
 localStorage.setItem('bw_name',n); $('welcome').classList.add('hidden'); render();
});
function showWelcome(){ $('nameInput').value=name(); $('welcome').classList.remove('hidden'); setTimeout(()=>$('nameInput').focus(),50) }

async function api(method,path,body){
 const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:body?JSON.stringify(body):undefined});
 if(!r.ok)throw new Error(await r.text()); return r.status===204?[]:r.json();
}
async function loadAttendance(){try{attendance=await api('GET','event_interest?select=event_id,user_name,status,user_id')}catch(e){console.warn('Social layer unavailable',e)}}


window.act=async(id,status)=>{
 if(!name()){showWelcome();return}
 const mine=attendance.find(x=>x.event_id===id&&x.user_id===uid());
 try{
  if(mine&&mine.status===status) await api('DELETE','event_interest?event_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(uid()));
  else if(mine) await api('PATCH','event_interest?event_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(uid()),{event_id:id,user_id:uid(),user_name:name(),status});
  else await api('POST','event_interest',{event_id:id,user_id:uid(),user_name:name(),status});
  await loadAttendance();render();renderPeople();

 }catch(e){alert('Could not save that yet. '+e.message)}
};
function render(){
 const end=new Date(friday);end.setDate(end.getDate()+2);
 $('week').textContent=friday.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
 let h='';
 ['FRIDAY','SATURDAY','SUNDAY'].forEach((label,i)=>{
  const d=new Date(friday);d.setDate(d.getDate()+i);
  const list=events.filter(e=>e.date===dateKey(d)&&enabled.includes(e.venue));
  h+=`<div class="day">${label} · ${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</div>`;
  h+=list.length?list.map(e=>{
   const ni=people(e.id,'not_interested'), a=people(e.id,'interested'), t=people(e.id,'ticket_bought');
   const mine=attendance.find(x=>x.event_id===e.id&&x.user_id===uid());
   const myPlusOne=Number(mine?.plus_one||0);
   const names=[...a.map(x=>`<span class="social-chip"><i class="social-icon heart">♡</i>${esc(x.user_name)}</span>`),...t.map(x=>`<span class="social-chip"><i class="social-icon ticket">🎟</i>${esc(x.user_name)}</span>`) ].join('');
   return `<article class="card"><div class="top"><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.venue)}${e.time?' · '+esc(e.time):''}</div></div>${e.status==='SOLD OUT'?'<span class="badge sold">SOLD OUT</span>':''}</div>
   ${e.price?`<div class="price">${esc(e.price)}</div>`:''}
   <div class="people"><span class="social-chip"><i class="social-icon heart">♡</i>${a.length} interested</span><span class="social-chip"><i class="social-icon ticket">🎟</i>${t.length} bought</span>${names}</div>
   ${mine?.status==='ticket_bought'?`<div class="plusone"><span>Bringing +1: <b>${myPlusOne}</b></span><button class="plusbtn" onclick="changePlusOne('${e.id}',-1)">−</button><button class="plusbtn" onclick="changePlusOne('${e.id}',1)">+</button></div>`:''}
   <div class="commitment">
     <button class="commit-btn no ${mine?.status==='not_interested'?'selected':''}" onclick="act('${e.id}','not_interested')"><span class="commit-icon">×</span><span>Not for me</span></button>
     <button class="commit-btn yes ${mine?.status==='interested'?'selected':''}" onclick="act('${e.id}','interested')"><span class="commit-icon">♡</span><span>Interested</span></button>
     <button class="commit-btn bought ${mine?.status==='ticket_bought'?'selected':''}" onclick="act('${e.id}','ticket_bought')"><span class="commit-icon">🎟</span><span>Bought</span></button>
   </div>
   <div class="actions"><a class="ticket" href="${esc(e.ticket_url)}" target="_blank" rel="noopener">TICKETS ↗</a></div></article>`;
  }).join(''):'<div class="empty">No events found for your selected venues.</div>';
 });
 $('discover').innerHTML=h;
}
async function changePlusOne(id,delta){
  if(!name()){showWelcome();return}
  const mine=attendance.find(a=>a.event_id===id&&a.user_id===uid());
  if(!mine || mine.status!=='ticket_bought'){alert('Choose “Bought” first, then add your +1.');return}
  const current=Number(mine.plus_one||0), next=Math.max(0,Math.min(1,current+delta));
  if(next===current)return;
  try{
    await api('PATCH','event_interest?event_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(uid()),{plus_one:next});
    mine.plus_one=next;
    render();renderPeople();
  }catch(e){alert('The +1 field is not available yet. Run the v11 Supabase migration, then try again.')}
}
async function clearStatus(id){
 if(!uname()){showWelcome();return}
 try{
  await api('DELETE','event_interest?event_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(uid()));
  await loadAttendance();render();renderPeople();
 }catch(e){alert('Could not clear your response. '+e.message)}
}
function renderPeople(){
 const active=events.filter(e=>people(e.id,'interested').length||people(e.id,'ticket_bought').length)
   .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(!active.length){$('peopleList').innerHTML='<div class="empty">Nobody has responded to an event yet.</div>';return}
 $('peopleList').innerHTML=active.map(e=>{
   const a=people(e.id,'interested'), t=people(e.id,'ticket_bought'), mine=attendance.find(x=>x.event_id===e.id&&x.user_id===uid());
   const namesI=a.map(x=>`<span class="social-chip"><i class="social-icon heart">♡</i>${esc(x.user_name)}</span>`).join('');
   const namesT=t.map(x=>`<span class="social-chip"><i class="social-icon ticket">🎟</i>${esc(x.user_name)}${Number(x.plus_one||0)?` +${Number(x.plus_one||0)}`:''}</span>`).join('');
   const myPlusOne=Number(mine?.plus_one||0);
   return `<div class="people-card card">
     <div class="top"><div><h3 style="margin:0">${esc(e.title)}</h3><div class="meta">${esc(e.venue)} · ${esc(e.date)}${e.time?' · '+esc(e.time):''}</div></div>${e.status==='SOLD OUT'?'<span class="badge sold">SOLD OUT</span>':''}</div>
     ${a.length?`<div class="happening-section"><span class="icon-chip heart">♡</span> Interested · ${a.length}</div><div class="people">${namesI}</div>`:''}
     ${t.length?`<div class="happening-section"><span class="icon-chip ticket">🎟</span> Ticket bought · ${t.length}</div><div class="people">${namesT}</div>`:''}
     ${mine?.status==='ticket_bought'?`<div class="plusone"><span>My +1: <b>${myPlusOne}</b></span><button class="plusbtn" onclick="changePlusOne('${e.id}',-1)" aria-label="Remove plus one">−</button><button class="plusbtn" onclick="changePlusOne('${e.id}',1)" aria-label="Add plus one">+</button></div>`:''}
     <div class="commitment">
       <button class="commit-btn no ${mine?.status==='not_interested'?'selected':''}" onclick="act('${e.id}','not_interested')"><span class="commit-icon">×</span><span>Not for me</span></button>
       <button class="commit-btn yes ${mine?.status==='interested'?'selected':''}" onclick="act('${e.id}','interested')"><span class="commit-icon">♡</span><span>Interested</span></button>
       <button class="commit-btn bought ${mine?.status==='ticket_bought'?'selected':''}" onclick="act('${e.id}','ticket_bought')"><span class="commit-icon">🎟</span><span>Bought</span></button>
     </div>
     <div class="actions"><a class="ticket" href="${esc(e.ticket_url)}" target="_blank" rel="noopener">TICKETS ↗</a></div>
   </div>`;
 }).join('');
}
function renderVenues(){
 $('venueList').innerHTML=VENUES.map(v=>`<label class="venue-row">${v}<input type="checkbox" data-v="${v}" ${enabled.includes(v)?'checked':''}></label>`).join('');
 document.querySelectorAll('[data-v]').forEach(x=>x.onchange=()=>{enabled=x.checked?[...new Set([...enabled,x.dataset.v])]:enabled.filter(v=>v!==x.dataset.v);localStorage.setItem('bw_venues',JSON.stringify(enabled));render()});
}
async function refresh(){
 try{const j=await (await fetch('events.json?x='+Date.now(),{cache:'no-store'})).json();events=j.events||[];$('subtitle').textContent=`${events.length} events · updated ${j.updated||''}`;render()}catch(e){console.warn(e)}
}
$('prev').onclick=()=>{friday.setDate(friday.getDate()-7);render()};
$('next').onclick=()=>{friday.setDate(friday.getDate()+7);render()};
$('today').onclick=()=>{friday=getFriday();render()};
$('refresh').onclick=refresh;
$('changeName').onclick=showWelcome;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['discover','peopleTab','venuesTab'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='peopleTab')renderPeople();if(b.dataset.tab==='venuesTab')renderVenues()});
renderVenues(); render(); renderPeople(); if(name())$('welcome').classList.add('hidden'); else showWelcome();
refresh(); loadAttendance().then(render);
})();
</script>
</body></html>
