<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brighton Weekend</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f7f7f8;font-family:system-ui,-apple-system,Arial;padding-bottom:75px}header{position:sticky;top:0;z-index:5;background:#101114f2;backdrop-filter:blur(12px);border-bottom:1px solid #303139;padding:16px}.wrap{max-width:780px;margin:auto;padding:0 14px}h1{margin:0;font-size:27px;letter-spacing:-1px}h1 b,.accent,.day{color:#caff45}.sub{font-size:12px;color:#aaa;margin-top:4px}.controls{display:flex;gap:7px;margin-top:13px}.controls button{border:1px solid #383943;background:#1b1c22;color:#fff;border-radius:9px;padding:10px;font-weight:750}.week{flex:1}.today{color:#caff45!important}.statusline{font-size:11px;color:#999;margin-top:8px}.day{font-size:12px;font-weight:900;letter-spacing:1px;margin:21px 0 7px}.card{background:#1a1b21;border:1px solid #30313a;border-radius:14px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:17px;font-weight:800}.meta{font-size:13px;color:#aaa;margin-top:5px}.badge{font-size:10px;font-weight:900;padding:5px 7px;border-radius:20px;height:max-content}.sold{background:#6d2834;color:#ffc0c9}.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:#bbb}.people span{background:#25262d;padding:5px 7px;border-radius:20px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.ticket{border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800;text-decoration:none}.interest,.going{background:#25262e;border:1px solid #444550;color:#fff}.interest.active{border-color:#caff45;color:#caff45}.going.active{background:#caff45;color:#101114;border-color:#caff45}.ticket{background:#fff;color:#111}.empty{color:#777;padding:10px 0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#191a20;border-top:1px solid #34353d;display:flex;justify-content:space-around;padding:13px}.nav button{border:0;background:none;color:#999;font-size:12px;font-weight:800}.nav .active{color:#caff45}.hidden{display:none}.venue-row{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid #303139}.venue-row input{width:21px;height:21px;accent-color:#caff45}.modal{position:fixed;inset:0;background:#090a0ddd;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{width:min(420px,100%);background:#1a1b21;border:1px solid #353640;border-radius:18px;padding:24px}.modal input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#101114;color:#fff;font-size:16px}.modal button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#caff45;font-weight:900}.note{font-size:12px;color:#999}
</style></head><body>
<div id="nameModal" class="modal hidden"><div class="modalbox"><h2>Welcome to <span class="accent">Brighton Weekend</span></h2><p>What should we call you?</p><input id="nameInput" maxlength="40" placeholder="Your name"><button id="saveName">LET'S GO →</button></div></div>
<header><div class="wrap"><h1>BRIGHTON <b>WEEKEND</b></h1><div class="sub" id="subtitle">Friday · Saturday · Sunday</div><div class="controls"><button id="prev">‹</button><button class="week" id="week"></button><button id="next">›</button><button class="today" id="today">TODAY</button><button id="refresh">↻</button></div><div class="statusline" id="statusline"></div></div></header>
<main class="wrap" id="discover"></main><main class="wrap hidden" id="venuesTab"><h2>Venues</h2><p class="note">Your choices are remembered on this device.</p><div id="venueList"></div><br><button id="changeName">Change my name</button></main>
<div class="nav"><button class="active" data-tab="discover">♫ DISCOVER</button><button data-tab="venuesTab">⚙ VENUES</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://zqvccsnfrkrtcsitfwcd.supabase.co',SUPABASE_KEY='sb_publishable_IyzJ6iCrIIkCtYBhNkQUog_GelEFKo1';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const VENUES=["Brighton Centre","Brighton Dome","CHALK","Concorde 2","The Old Market","Green Door Store","Volks","Quarters","Patterns","DUST"];
const $=x=>document.getElementById(x);let events=[],attendance=[],enabled=JSON.parse(localStorage.bwV||'null')||VENUES,friday;
function uid(){let x=localStorage.bwUID;if(!x){x=crypto.randomUUID();localStorage.bwUID=x}return x}function uname(){return localStorage.bwName||''}
function weekendStart(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(5-d.getDay()+7)%7);return d}friday=weekendStart();
function k(d){return d.toISOString().slice(0,10)}function ep(id,s){return attendance.filter(a=>a.event_id===id&&a.status===s)}
async function loadAttendance(){let r=await db.from('event_interest').select('event_id,user_name,status,user_id');attendance=r.data||[]}
async function act(id,status){if(!uname()){showName();return}let mine=attendance.find(a=>a.event_id===id&&a.user_id===uid()),p={event_id:id,user_id:uid(),user_name:uname(),status};let r;if(mine&&mine.status===status)r=await db.from('event_interest').delete().eq('event_id',id).eq('user_id',uid());else if(mine)r=await db.from('event_interest').update(p).eq('event_id',id).eq('user_id',uid());else r=await db.from('event_interest').insert(p);if(r.error)alert(r.error.message);await loadAttendance();render()}
function render(){let end=new Date(friday);end.setDate(end.getDate()+2);week.textContent=friday.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'numeric',month:'short'});let h='';for(let i=0;i<3;i++){let d=new Date(friday);d.setDate(d.getDate()+i);let list=events.filter(e=>e.date===k(d)&&enabled.includes(e.venue));h+=`<div class="day">${['FRIDAY','SATURDAY','SUNDAY'][i]} · ${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</div>`;h+=list.length?list.map(e=>{let a=ep(e.id,'interested'),g=ep(e.id,'going'),m=attendance.find(x=>x.event_id===e.id&&x.user_id===uid());return `<article class=card><div class=top><div><div class=title>${e.title}</div><div class=meta>${e.venue}${e.time?' · '+e.time:''}</div></div>${e.status==='SOLD OUT'?'<span class="badge sold">SOLD OUT</span>':''}</div><div class=people><span>☆ ${a.length} interested</span><span>✓ ${g.length} going</span>${[...a.map(x=>'☆ '+x.user_name),...g.map(x=>'✓ '+x.user_name)].map(x=>'<span>'+x+'</span>').join('')}</div><div class=actions><button class="interest ${m?.status==='interested'?'active':''}" onclick="act('${e.id}','interested')">☆ I'M INTERESTED</button><button class="going ${m?.status==='going'?'active':''}" onclick="act('${e.id}','going')">✓ I'M GOING</button><a class=ticket target=_blank href="${e.ticket_url}">TICKETS ↗</a></div></article>`}).join(''):'<div class=empty>No events found.</div>'}$('discover').innerHTML=h}}
function rv(){venueList.innerHTML=VENUES.map(v=>`<label class=venue-row>${v}<input type=checkbox data-v="${v}" ${enabled.includes(v)?'checked':''}></label>`).join('');document.querySelectorAll('[data-v]').forEach(x=>x.onchange=()=>{enabled=x.checked?[...new Set([...enabled,x.dataset.v])]:enabled.filter(v=>v!==x.dataset.v);localStorage.bwV=JSON.stringify(enabled);render()})}
async function refresh(){statusline.textContent='Refreshing…';try{let j=await (await fetch('events.json?x='+Date.now(),{cache:'no-store'})).json();events=j.events||[];subtitle.textContent=`${events.length} events · updated ${j.updated||''}`;await loadAttendance();render();statusline.textContent=`✓ Updated · ${events.length} events loaded`}catch(e){statusline.textContent='Could not refresh'}}
function showName(){nameModal.classList.remove('hidden');nameInput.value=uname()}saveName.onclick=()=>{let n=nameInput.value.trim();if(n){localStorage.bwName=n;nameModal.classList.add('hidden');render()}};changeName.onclick=showName;
prev.onclick=()=>{friday.setDate(friday.getDate()-7);render()};next.onclick=()=>{friday.setDate(friday.getDate()+7);render()};today.onclick=()=>{friday=weekendStart();render()};refresh.onclick=refresh;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['discover','venuesTab'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='venuesTab')rv()});
if(!uname())showName();rv();refresh();window.act=act;
</script></body></html>
