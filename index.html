<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brighton Weekend</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f7f7f8;font-family:system-ui,-apple-system,Arial;padding-bottom:75px}header{position:sticky;top:0;z-index:5;background:#101114f2;backdrop-filter:blur(12px);border-bottom:1px solid #303139;padding:16px}.wrap{max-width:780px;margin:auto;padding:0 14px}h1{margin:0;font-size:27px;letter-spacing:-1px}h1 b,.accent,.day{color:#caff45}.sub{font-size:12px;color:#aaa;margin-top:4px}.controls{display:flex;gap:7px;margin-top:13px}.controls button{border:1px solid #383943;background:#1b1c22;color:#fff;border-radius:9px;padding:10px;font-weight:750}.week{flex:1}.today{color:#caff45!important}.statusline{font-size:11px;color:#999;margin-top:8px}.day{font-size:12px;font-weight:900;letter-spacing:1px;margin:21px 0 7px}.card{background:#1a1b21;border:1px solid #30313a;border-radius:14px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:17px;font-weight:800}.meta{font-size:13px;color:#aaa;margin-top:5px}.badge{font-size:10px;font-weight:900;padding:5px 7px;border-radius:20px;height:max-content}.sold{background:#6d2834;color:#ffc0c9}.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:#bbb}.people span{background:#25262d;padding:5px 7px;border-radius:20px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.ticket{border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800;text-decoration:none}.interest,.going{background:#25262e;border:1px solid #444550;color:#fff}.interest.active{border-color:#caff45;color:#caff45}.going.active{background:#caff45;color:#101114;border-color:#caff45}.ticket{background:#fff;color:#111}.empty{color:#777;padding:10px 0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#191a20;border-top:1px solid #34353d;display:flex;justify-content:space-around;padding:13px}.nav button{border:0;background:none;color:#999;font-size:12px;font-weight:800}.nav .active{color:#caff45}.hidden{display:none}.venue-row{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid #303139}.venue-row input{width:21px;height:21px;accent-color:#caff45}.modal{position:fixed;inset:0;background:#090a0ddd;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{width:min(420px,100%);background:#1a1b21;border:1px solid #353640;border-radius:18px;padding:24px}.modal input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#101114;color:#fff;font-size:16px}.modal button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#caff45;font-weight:900}.note{font-size:12px;color:#999}
</style></head><body>
<div id="nameModal" class="modal hidden"><div class="modalbox"><h2>Welcome to <span class="accent">Brighton Weekend</span></h2><p>What should we call you?</p><input id="nameInput" maxlength="40" placeholder="Your name"><button id="saveName">LET'S GO →</button></div></div>
<header><div class="wrap"><h1>BRIGHTON <b>WEEKEND</b></h1><div class="sub" id="subtitle">Friday · Saturday · Sunday</div><div class="controls"><button id="prev">‹</button><button class="week" id="week"></button><button id="next">›</button><button class="today" id="today">TODAY</button><button id="refresh">↻</button></div><div class="statusline" id="statusline"></div></div></header>
<main class="wrap" id="discover"></main><main class="wrap hidden" id="venuesTab"><h2>Venues</h2><p class="note">Your choices are remembered on this device.</p><div id="venueList"></div><br><button id="changeName">Change my name</button></main>
<div class="nav"><button class="active" data-tab="discover">♫ DISCOVER</button><button data-tab="venuesTab">⚙ VENUES</button></div>
<script>
(() => {
'use strict';
const SUPABASE_URL='https://zqvccsnfrkrtcsitfwcd.supabase.co';
const SUPABASE_KEY='sb_publishable_IyzJ6iCrIIkCtYBhNkQUog_GelEFKo1';
const VENUES=["Brighton Centre","Brighton Dome","CHALK","Concorde 2","The Old Market","Green Door Store","Volks","Quarters","Patterns","DUST"];
const $=id=>document.getElementById(id);
const nameModal=$('nameModal'), nameInput=$('nameInput'), saveName=$('saveName');
const subtitle=$('subtitle'), statusline=$('statusline'), weekBtn=$('week');
let events=[], attendance=[], enabled=JSON.parse(localStorage.getItem('bwV')||'null')||VENUES;
let friday=weekendStart(), supabaseReady=false;

function weekendStart(){
  const d=new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate()+(5-d.getDay()+7)%7); return d;
}
function uid(){
  let x=localStorage.getItem('bwUID');
  if(!x){x=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem('bwUID',x)}
  return x;
}
function uname(){return localStorage.getItem('bwName')||''}
function showName(){nameModal.classList.remove('hidden'); nameInput.value=uname(); setTimeout(()=>nameInput.focus(),50)}
function hideName(){nameModal.classList.add('hidden')}
function saveUserName(){
  const n=nameInput.value.trim();
  if(!n){nameInput.focus();return}
  localStorage.setItem('bwName',n);
  hideName();
  render();
}
saveName.addEventListener('click',saveUserName);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveUserName()});

function key(d){return d.toISOString().slice(0,10)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function ep(id,status){return attendance.filter(a=>a.event_id===id&&a.status===status)}

async function api(method,path,body){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method,headers:{
      'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json','Prefer':'return=representation'
    },body:body?JSON.stringify(body):undefined
  });
  if(!r.ok) throw new Error(await r.text());
  return r.status===204?[]:await r.json();
}
async function loadAttendance(){
  if(!supabaseReady)return;
  try{attendance=await api('GET','event_interest?select=event_id,user_name,status,user_id')}
  catch(e){console.warn(e); statusline.textContent='Social features temporarily unavailable.'}
}
async function act(id,status){
  if(!uname()){showName();return}
  if(!supabaseReady){alert('The social connection is still loading. Please try again in a moment.');return}
  const mine=attendance.find(a=>a.event_id===id&&a.user_id===uid());
  try{
    if(mine&&mine.status===status) await api('DELETE',`event_interest?event_id=eq.${encodeURIComponent(id)}&user_id=eq.${encodeURIComponent(uid())}`);
    else if(mine) await api('PATCH',`event_interest?event_id=eq.${encodeURIComponent(id)}&user_id=eq.${encodeURIComponent(uid())}`,{event_id:id,user_id:uid(),user_name:uname(),status});
    else await api('POST','event_interest',{event_id:id,user_id:uid(),user_name:uname(),status});
    await loadAttendance(); render();
  }catch(e){console.error(e);alert('Could not save your choice. '+e.message)}
}
window.act=act;

function render(){
  const end=new Date(friday);end.setDate(end.getDate()+2);
  weekBtn.textContent=friday.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  let h='';
  for(let i=0;i<3;i++){
    const d=new Date(friday);d.setDate(d.getDate()+i);
    const list=events.filter(e=>e.date===key(d)&&enabled.includes(e.venue));
    h+=`<div class="day">${['FRIDAY','SATURDAY','SUNDAY'][i]} · ${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</div>`;
    h+=list.length?list.map(e=>{
      const a=ep(e.id,'interested'),g=ep(e.id,'going'),m=attendance.find(x=>x.event_id===e.id&&x.user_id===uid());
      const names=[...a.map(x=>'☆ '+esc(x.user_name)),...g.map(x=>'✓ '+esc(x.user_name))];
      return `<article class="card"><div class="top"><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.venue)}${e.time?' · '+esc(e.time):''}</div></div>${e.status==='SOLD OUT'?'<span class="badge sold">SOLD OUT</span>':''}</div><div class="people"><span>☆ ${a.length} interested</span><span>✓ ${g.length} going</span>${names.map(x=>'<span>'+x+'</span>').join('')}</div><div class="actions"><button class="interest ${m?.status==='interested'?'active':''}" onclick="act('${e.id}','interested')">☆ I'M INTERESTED</button><button class="going ${m?.status==='going'?'active':''}" onclick="act('${e.id}','going')">✓ I'M GOING</button><a class="ticket" target="_blank" rel="noopener" href="${e.ticket_url}">TICKETS ↗</a></div></article>`;
    }).join(''):'<div class="empty">No events found.</div>';
  }
  $('discover').innerHTML=h;
}
function renderVenues(){
  $('venueList').innerHTML=VENUES.map(v=>`<label class="venue-row">${v}<input type="checkbox" data-v="${esc(v)}" ${enabled.includes(v)?'checked':''}></label>`).join('');
  document.querySelectorAll('[data-v]').forEach(x=>x.addEventListener('change',()=>{
    enabled=x.checked?[...new Set([...enabled,x.dataset.v])]:enabled.filter(v=>v!==x.dataset.v);
    localStorage.setItem('bwV',JSON.stringify(enabled));render();
  }));
}
async function refresh(){
  statusline.textContent='Refreshing…';
  try{
    const j=await (await fetch('events.json?x='+Date.now(),{cache:'no-store'})).json();
    events=j.events||[];
    subtitle.textContent=`${events.length} events · updated ${j.updated||''}`;
    render();
    statusline.textContent=`✓ Updated · ${events.length} events loaded`;
  }catch(e){statusline.textContent='Could not refresh event data.'}
}
$('changeName').addEventListener('click',showName);
$('prev').addEventListener('click',()=>{friday.setDate(friday.getDate()-7);render()});
$('next').addEventListener('click',()=>{friday.setDate(friday.getDate()+7);render()});
$('today').addEventListener('click',()=>{friday=weekendStart();render()});
$('refresh').addEventListener('click',refresh);
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  ['discover','venuesTab'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));
  if(b.dataset.tab==='venuesTab')renderVenues();
}));

// Crucially: onboarding is available before any network calls.
renderVenues(); render();
if(!uname()) showName();
refresh();
loadAttendance().then(()=>{supabaseReady=true;render()}).catch(()=>{});
})();
</script></body></html>
